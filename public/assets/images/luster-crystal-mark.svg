    <linearGradient id="whiteFacet" x1="134" y1="126" x2="326" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#c9fbff" stop-opacity="0.62"/>
    </linearGradient>

    <linearGradient id="gold" x1="50" y1="332" x2="462" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb100"/>
      <stop offset="0.18" stop-color="#fff06a"/>
      <stop offset="0.5" stop-color="#ffbb19"/>
      <stop offset="0.82" stop-color="#fff16a"/>
      <stop offset="1" stop-color="#ffb000"/>
