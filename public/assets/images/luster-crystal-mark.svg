    </linearGradient>

    <linearGradient id="gemBottom" x1="206" y1="304" x2="302" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4df2ec"/>
      <stop offset="0.48" stop-color="#1ec8ff"/>
