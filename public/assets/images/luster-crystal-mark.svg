<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Luster crystal mark</title>
  <desc id="desc">A faceted pink, purple, and cyan crystal with a golden crescent and two sparkles.</desc>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#19204b"/>
      <stop offset="0.48" stop-color="#0a0a24"/>
      <stop offset="1" stop-color="#030514"/>
    </radialGradient>

    <linearGradient id="gemTop" x1="95" y1="104" x2="420" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fae"/>
      <stop offset="0.45" stop-color="#ff7ed6"/>
      <stop offset="1" stop-color="#7728ff"/>
    </linearGradient>

    <linearGradient id="gemLeft" x1="82" y1="216" x2="278" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff41b3"/>
      <stop offset="0.45" stop-color="#a02cff"/>
      <stop offset="1" stop-color="#22d8ff"/>
    </linearGradient>

    <linearGradient id="gemRight" x1="422" y1="222" x2="248" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6e3cff"/>
