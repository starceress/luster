    <linearGradient id="goldShadow" x1="76" y1="372" x2="436" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a4a00"/>
      <stop offset="0.5" stop-color="#b46800"/>
      <stop offset="1" stop-color="#7b3f00"/>
    </linearGradient>

    <filter id="crystalGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        1 0 0 0 0.25
        0 1 0 0 0.06
        0 0 1 0 0.55
        0 0 0 0.85 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-30%" y="-80%" width="160%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        1 0 0 0 0.9
        0 1 0 0 0.45
        0 0 1 0 0
        0 0 0 0.65 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="gemClip">
