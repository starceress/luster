<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update your {fanlisting_name} Membership</title>
  <link rel="stylesheet" href="{base_url}/assets/css/public.css">
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header">
      <h1><a href="{fanlisting_url}">{fanlisting_name}</a></h1>
    </header>

    <main class="site-main">
      <h2>Update your Membership</h2>

      <div class="form-error" role="alert">{error}</div>

      <p>Fields marked <span aria-hidden="true">*</span> are required.</p>

      <form method="post" action="{base_url}/update/{fanlisting_id}" novalidate>
        <input type="hidden" name="_csrf" value="{csrf_token}">

        <div style="position:absolute;left:-9999px;top:-9999px;" aria-hidden="true">
          <label for="website_confirm">Leave this blank</label>
          <input type="text" name="website_confirm" id="website_confirm" tabindex="-1" autocomplete="off">
        </div>

        <!-- SECTION 1: Authentication -->
        <fieldset class="form-section">
          <legend>To verify your identity:</legend>

          <div class="form-group">
            <label for="email">Current Email Address <span aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" value="{old_email}" maxlength="255" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password">
              Current Password <span aria-hidden="true">*</span>
              <small><a href="{lost_password_url}" class="form-hint-link">Lost it?</a></small>
            </label>
            <input type="password" id="password" name="password" maxlength="255" required autocomplete="current-password">
          </div>
        </fieldset>

        <!-- SECTION 2: Updated details -->
        <fieldset class="form-section">
          <legend>Leave blank to keep unchanged:</legend>

          <div class="form-error" role="alert">{update_error}</div>

          <div class="form-group">
            <label for="new_name">Updated Name</label>
            <input type="text" id="new_name" name="new_name" value="{old_name}" maxlength="100" autocomplete="name">
          </div>

          <div class="form-group">
            <label for="new_email">Updated Email Address</label>
            <input type="email" id="new_email" name="new_email" value="{old_new_email}" maxlength="255" autocomplete="email">
          </div>

          <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" maxlength="255" autocomplete="new-password">
          </div>

          <div class="form-group">
            <label for="new_password_confirm">Confirm New Password</label>
            <input type="password" id="new_password_confirm" name="new_password_confirm" maxlength="255" autocomplete="new-password">
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            {country_select}
          </div>

          <div class="form-group">
            <label for="url">Updated Website URL</label>
            <input type="url" id="url" name="url" value="{old_url}" maxlength="255" placeholder="https://" autocomplete="url">
          </div>

          <div class="form-group form-check">
            <input type="checkbox" name="delete_url" id="delete_url" value="1">
            <label for="delete_url">Remove my website from my record</label>
          </div>

          {extra_fields}
        </fieldset>

        <div class="form-group">
          <label for="captcha_answer">Spam check: What is {captcha_question}? <span class="required">*</span></label>
          <input type="text" name="captcha_answer" id="captcha_answer" required autocomplete="off" inputmode="numeric">
        </div>
        <div class="form-error" role="alert">{captcha_error}</div>

        <div class="form-actions">
          <button type="submit">Update Membership</button>
        </div>
      </form>
    </main>

    <footer class="site-footer">
      <p>Powered by <a href="{base_url}">{app_name}</a></p>
    </footer>
  </div>
</body>
</html>
