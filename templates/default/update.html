<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Your Details &mdash; {fanlisting_name}</title>
  <link rel="stylesheet" href="{theme_path}style.css">
</head>
<body>

<div class="fl-wrap">

  <h2 class="fl-title">Update Your Details</h2>

  {errors}

  <form method="POST" action="{form_action}">
    <input type="hidden" name="_csrf" value="{csrf_token}">

    <div class="fl-field">
      <label class="fl-label" for="upd-name">Name <span aria-hidden="true">*</span></label>
      <input class="fl-input" type="text" id="upd-name" name="fan_name"
             value="{field_name}" required maxlength="100" autocomplete="name">
    </div>

    <div class="fl-field">
      <label class="fl-label" for="upd-email">Email</label>
      <input class="fl-input" type="email" id="upd-email" name="fan_email"
             value="{field_email}" maxlength="255" autocomplete="email" readonly>
    </div>

    <div class="fl-field">
      <label class="fl-label" for="upd-url">Website URL <span style="font-weight:400">(optional)</span></label>
      <input class="fl-input" type="url" id="upd-url" name="fan_url"
             value="{field_url}" maxlength="500" autocomplete="url" placeholder="https://">
    </div>

    {country_field}

    {extra_fields}

    <div class="fl-field">
      <label class="fl-label" for="upd-password">Password <span aria-hidden="true">*</span></label>
      <input class="fl-input" type="password" id="upd-password" name="fan_password"
             required maxlength="255" autocomplete="current-password">
    </div>

    <button class="fl-btn" type="submit">Update Details</button>

  </form>

</div>

</body>
</html>
