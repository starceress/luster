<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error &mdash; {fanlisting_name}</title>
  <link rel="stylesheet" href="{theme_path}style.css">
</head>
<body>

<div class="fl-wrap">

  <div class="fl-errors">
    <h2 style="margin:0 0 .5rem;color:var(--fl-error)">Something went wrong</h2>
    <p style="margin:0">{error_message}</p>
  </div>

  <p style="margin-top:1.25rem">
    <a class="fl-page-link" href="{fanlisting_url}">&larr; Back to {fanlisting_name}</a>
  </p>

</div>

</body>
</html>
