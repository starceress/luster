<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave {fanlisting_name}</title>
  <link rel="stylesheet" href="{theme_path}style.css">
</head>
<body>

<div class="fl-wrap">

  <h2 class="fl-title">Leave {fanlisting_name}</h2>

  <p>Enter your email and password to remove yourself from <strong>{fanlisting_name}</strong>. This cannot be undone.</p>

  {errors}

  <form method="POST" action="{form_action}">
    <input type="hidden" name="_csrf" value="{csrf_token}">

    <div class="fl-field">
      <label class="fl-label" for="rem-email">Email <span aria-hidden="true">*</span></label>
      <input class="fl-input" type="email" id="rem-email" name="fan_email"
             required maxlength="255" autocomplete="email">
    </div>

    <div class="fl-field">
      <label class="fl-label" for="rem-password">Password <span aria-hidden="true">*</span></label>
      <input class="fl-input" type="password" id="rem-password" name="fan_password"
             required maxlength="255" autocomplete="current-password">
    </div>

    <button class="fl-btn" type="submit" style="background:#c0392b">Remove Me</button>

  </form>

</div>

</body>
</html>
