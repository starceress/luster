<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{fanlisting_name} &mdash; Members</title>
  <link rel="stylesheet" href="{theme_path}style.css">
</head>
<body>

<div class="fl-wrap">

  <h2 class="fl-title">{fanlisting_name} &mdash; Members</h2>

  <p>{member_count} members</p>

  <ul class="fl-member-list">
    {member_loop}
    <li class="fl-member">
      <a class="fl-page-link" href="{fan_url}">{fan_name}</a> &mdash; {fan_country}
    </li>
    {/member_loop}
  </ul>

  <span class="fl-empty">{empty_message}</span>

  {pagination}

</div>

</body>
</html>
