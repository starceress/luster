<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join {fanlisting_name}</title>
  <link rel="stylesheet" href="{theme_path}style.css">
</head>
<body>

<div class="fl-wrap">

  <h2 class="fl-title">Join {fanlisting_name}</h2>

  {errors}

  <form method="POST" action="{form_action}">
    <input type="hidden" name="_csrf" value="{csrf_token}">

    <div class="fl-field">
      <label class="fl-label" for="join-name">Name <span aria-hidden="true">*</span></label>
      <input class="fl-input" type="text" id="join-name" name="fan_name"
             value="{field_name}" required maxlength="100" autocomplete="name">
    </div>

    <div class="fl-field">
      <label class="fl-label" for="join-email">Email <span aria-hidden="true">*</span></label>
      <input class="fl-input" type="email" id="join-email" name="fan_email"
             value="{field_email}" required maxlength="255" autocomplete="email">
    </div>

    <div class="fl-field">
      <label class="fl-label" for="join-url">Website URL <span style="font-weight:400">(optional)</span></label>
      <input class="fl-input" type="url" id="join-url" name="fan_url"
             value="{field_url}" maxlength="500" autocomplete="url" placeholder="https://">
    </div>

    {country_field}

    {extra_fields}

    <div class="fl-field">
      <label class="fl-label" for="join-password">Password &mdash; for future updates/removal <span aria-hidden="true">*</span></label>
      <input class="fl-input" type="password" id="join-password" name="fan_password"
             required maxlength="255" autocomplete="new-password">
    </div>

    <button class="fl-btn" type="submit">Join</button>

  </form>

</div>

</body>
</html>
