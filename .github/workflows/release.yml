name: Release

# Builds a ready-to-upload Luster package and attaches it to the GitHub Release.
# The zip already contains vendor/ (built with --no-dev), so end users never
# need to run Composer themselves — unzip, upload, and run the installer.
#
# Triggered by pushing a tag like "v1.0.0".

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, intl, zip, gd, fileinfo
          tools: composer
          coverage: none

      - name: Verify tag matches Version::CURRENT
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SRC_VERSION=$(grep -oP "public const CURRENT\s*=\s*'\K[^']+" src/Core/Version.php)
          if [ "$TAG_VERSION" != "$SRC_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match Version::CURRENT (${SRC_VERSION}) in src/Core/Version.php — bump Version::CURRENT and commit before tagging."
            exit 1
          fi

      - name: Install dependencies (including dev, to run tests)
        run: composer install --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      # The tests upload files while they run, and this is the folder that gets packaged.
      - name: Remove what the tests left behind
        run: git clean -ffdx -- public/uploads storage

      - name: Install production dependencies only
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Stamp build timestamp
        run: |
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          sed -i "s|public const BUILT_AT.*=.*'[^']*';|public const BUILT_AT      = '${BUILT_AT}';|" src/Core/Version.php

      - name: Assemble package contents
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="luster-${VERSION}"
          mkdir -p "dist/${PKG}"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env.example' \
            --exclude='.gitignore' \
            --exclude='.phpunit.result.cache' \
            --exclude='AGENTS.md' \
            --exclude='RELEASING.md' \
            --exclude='composer.lock' \
            --exclude='dist' \
            --exclude='docs' \
            --exclude='phpunit.xml' \
            --exclude='samples' \
            --exclude='tests' \
            --exclude='vendor/phpmailer/phpmailer/language' \
            --exclude='vendor/phpmailer/phpmailer/README.md' \
            --exclude='vendor/phpmailer/phpmailer/SECURITY.md' \
            --exclude='vendor/phpmailer/phpmailer/SMTPUTF8.md' \
            --exclude='vendor/phpmailer/phpmailer/VERSION' \
            --exclude='vendor/phpmailer/phpmailer/composer.json' \
            --exclude='vendor/phpmailer/phpmailer/get_oauth_token.php' \
            --exclude='vendor/phpmailer/phpmailer/COMMITMENT' \
            --exclude='.gitkeep' \
            ./ "dist/${PKG}/"

          # Ensure empty directories survive without .gitkeep
          mkdir -p "dist/${PKG}/storage/logs" "dist/${PKG}/storage/cache"

          # A new install starts with no uploads, only the files that protect those folders.
          LEFTOVERS=$(find "dist/${PKG}/public/uploads" -type f ! -name '.htaccess')
          if [ -n "$LEFTOVERS" ]; then
            echo "::error::These uploads would end up in the release ZIP:"
            echo "$LEFTOVERS"
            exit 1
          fi

          echo "PKG=${PKG}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create zip
        working-directory: dist/${{ env.PKG }}
        run: zip -9 -r "../../${PKG}.zip" .

      - name: Generate SHA256SUMS
        run: sha256sum "${PKG}.zip" > SHA256SUMS

      - name: Attach release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PKG }}.zip
            SHA256SUMS
          body: "Full Changelog: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}"
          make_latest: true
